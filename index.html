<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Horas - Portones Automáticos Córdoba</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #e9ecef; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; border-bottom: 3px solid #007BFF; padding-bottom: 10px; margin-top: 0; }
        
        /* Dashboard de Resultados */
        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-bottom: 30px; }
        .box { padding: 20px; text-align: center; border-radius: 10px; color: white; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .box-50 { background: linear-gradient(135deg, #f39c12, #e67e22); }
        .box-100 { background: linear-gradient(135deg, #e74c3c, #c0392b); }
        .box-night { background: linear-gradient(135deg, #34495e, #2c3e50); }
        .box-francos { background: linear-gradient(135deg, #27ae60, #2ecc71); }
        .box label { font-size: 0.9em; opacity: 0.9; display: block; margin-bottom: 5px; }
        .box span { font-size: 1.8em; font-weight: bold; }

        /* Estilos de Formulario */
        .section { background: #f8f9fa; padding: 20px; border-radius: 10px; margin-bottom: 25px; border: 1px solid #dee2e6; }
        h3 { margin-top: 0; color: #495057; font-size: 1.2em; }
        .grid-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; color: #495057; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ced4da; border-radius: 6px; box-sizing: border-box; }
        
        /* Botones */
        .btn-group { display: flex; gap: 10px; margin-bottom: 20px; }
        .btn { flex: 1; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.3s; color: white; text-transform: uppercase; }
        .btn-in { background-color: #28a745; }
        .btn-out { background-color: #fd7e14; }
        .btn-save { background-color: #007bff; width: 100%; font-size: 1.1em; }
        .btn:hover { opacity: 0.9; transform: translateY(-1px); }
        
        /* Botones pequeños para la tabla */
        .btn-sm { padding: 6px 10px; font-size: 0.8em; margin-right: 5px; border: none; border-radius: 4px; cursor: pointer; color: white; }
        .btn-edit { background-color: #f1c40f; color: #333; font-weight: bold; }
        .btn-delete { background-color: #e74c3c; font-weight: bold; }

        /* Historial */
        .historial-container { margin-top: 20px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #ddd; font-size: 0.9em; }
        th { background-color: #f1f1f1; color: #333; }
        tr:hover { background-color: #f9f9f9; }

        .info-text { font-size: 0.9em; color: #6c757d; margin-top: 5px; }
        
        /* Listas de historial Francos/Vacaciones */
        .lista-historial { list-style-type: none; padding: 0; margin-top: 10px; font-size: 0.9em; color: #555; }
        .lista-historial li { background: #fff; padding: 8px; margin-bottom: 5px; border-radius: 4px; border: 1px solid #ddd; display: flex; justify-content: space-between; }
        
        /* --- AJUSTES RESPONSIVOS PARA MÓVILES Y TABLETS --- */
        @media (max-width: 768px) {
            body { padding: 10px; }
            .container { padding: 15px; border-radius: 8px; }
            .dashboard { grid-template-columns: 1fr 1fr; gap: 10px; }
            .grid-inputs { grid-template-columns: 1fr; gap: 20px; }
            .btn-group { flex-direction: column; }
            .btn { padding: 15px; font-size: 1em; } 
            input, select { font-size: 16px !important; padding: 12px; } 
            
            /* Ajuste para que los inputs en línea no se aplasten en pantallas chicas */
            .section div[style*="display: flex; gap: 10px;"]:not(.form-group) { flex-wrap: wrap; }
            .section div[style*="display: flex; gap: 10px;"]:not(.form-group) > input { flex: 1 1 100%; }
            .section div[style*="display: flex; gap: 10px;"]:not(.form-group) > button { flex: 1 1 100%; margin-top: 5px; }
            
            /* Asegurar que la tabla sea fácil de leer y se pueda scrollear */
            th, td { font-size: 0.85em; padding: 10px 8px; white-space: nowrap; }
        }
        @media (max-width: 480px) {
            .dashboard { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Control de Horas Laborales</h2>

    <div class="form-group" style="width: 200px; max-width: 100%;">
        <label>Año en curso:</label>
        <select id="select-year"></select>
    </div>

    <div class="dashboard">
        <div class="box box-50"><label>Extras 50% Totales</label><span id="res-50">0:00</span></div>
        <div class="box box-100"><label>Extras 100% Totales</label><span id="res-100">0:00</span></div>
        <div class="box box-night"><label>Nocturnas Totales</label><span id="res-night">0:00</span></div>
        <div class="box box-francos"><label>Compensatorios Disponibles</label><span id="res-francos">0</span></div>
    </div>

    <div class="section">
        <h3>Registro de Jornada</h3>
        <div class="btn-group">
            <button class="btn btn-in" onclick="marcar('entrada')">Registrar Entrada</button>
            <button class="btn btn-out" onclick="marcar('salida')">Registrar Salida</button>
        </div>

        <div class="grid-inputs">
            <div>
                <label>Fecha y Hora Entrada</label>
                <input type="datetime-local" id="input-entrada">
            </div>
            <div>
                <label>Fecha y Hora Salida</label>
                <input type="datetime-local" id="input-salida">
            </div>
        </div>

        <div class="form-group" style="display: flex; align-items: center; gap: 10px;">
            <input type="checkbox" id="check-feriado" style="width: auto;">
            <label for="check-feriado" style="margin:0;">¿Es día Feriado?</label>
        </div>

        <button id="btn-procesar" class="btn btn-save" onclick="procesarJornada()">Calcular y Cargar Turno</button>
    </div>

    <div class="section">
        <h3>Detalle de Turnos Cargados</h3>
        <div class="historial-container">
            <table id="tabla-historial">
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Entrada</th>
                        <th>Salida</th>
                        <th>50%</th>
                        <th>100%</th>
                        <th>Noct.</th>
                        <th>Franco</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
            </table>
        </div>
    </div>

    <div class="section">
        <h3>Francos y Vacaciones</h3>
        <div class="grid-inputs">
            <div>
                <label>Usar Franco (Fecha)</label>
                <div style="display: flex; gap: 10px;">
                    <input type="date" id="fecha-uso-franco">
                    <button class="btn btn-out" style="flex: 0.5;" onclick="registrarUsoFranco()">Descontar</button>
                </div>
                <ul id="lista-francos" class="lista-historial"></ul>
            </div>
            
            <div>
                <label>Vacaciones (Desde - Hasta)</label>
                <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                    <input type="date" id="vacaciones-desde" title="Desde">
                    <input type="date" id="vacaciones-hasta" title="Hasta">
                </div>
                <button class="btn btn-save" style="font-size: 1em; padding: 10px;" onclick="registrarVacaciones()">Registrar Vacaciones</button>
                
                <div style="margin-top: 15px; padding: 10px; background: #e9ecef; border-radius: 6px;">
                    <strong>Vacaciones Restantes: </strong> <span id="vacaciones-restantes" style="font-size: 1.2em; color: #d35400; font-weight: bold;">21</span> días
                </div>
                <ul id="lista-vacaciones" class="lista-historial"></ul>
            </div>
        </div>
    </div>
</div>

<script type="module">
    // --- INTEGRACIÓN DE FIREBASE ---
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBBaYb33EUlfTijKo0gzSL1QWH4sJTKb2A",
        authDomain: "horas-trabajadas-ba84c.firebaseapp.com",
        projectId: "horas-trabajadas-ba84c",
        storageBucket: "horas-trabajadas-ba84c.firebasestorage.app",
        messagingSenderId: "196282015917",
        appId: "1:196282015917:web:f768c69505b662f402e624"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const turnosRef = collection(db, "turnos");
    const francosRef = collection(db, "francosUsados");
    const vacRef = collection(db, "vacaciones");

    // VARIABLES GLOBALES (Ahora sincronizadas con Firebase)
    let listadoTurnos = [];
    let francosUsados = [];
    let vacacionesTomadas = [];
    let totalVacacionesAnuales = 21;
    let idEdicion = null; 

    // --- TU LÓGICA ORIGINAL (Mantenida intacta) ---
    const selectYear = document.getElementById('select-year');
    const anioActual = new Date().getFullYear();
    for(let i = anioActual-1; i <= anioActual+1; i++) {
        let opt = document.createElement('option');
        opt.value = i; opt.text = i;
        if(i === anioActual) opt.selected = true;
        selectYear.appendChild(opt);
    }

    window.aplicarReglaRedondeo = function(fecha) {
        let f = new Date(fecha);
        let minutos = f.getMinutes();
        let horas = f.getHours();
        if (minutos >= 0 && minutos <= 5) f.setMinutes(0);
        else if (minutos > 5 && minutos <= 35) f.setMinutes(30);
        else if (minutos > 35) { f.setHours(horas + 1); f.setMinutes(0); }
        f.setSeconds(0); f.setMilliseconds(0);
        return f;
    }

    window.marcar = function(tipo) {
        let ahora = new Date();
        let redondeada = aplicarReglaRedondeo(ahora);
        let tzoffset = (new Date()).getTimezoneOffset() * 60000;
        let localISOTime = (new Date(redondeada - tzoffset)).toISOString().slice(0, 16);
        document.getElementById(tipo === 'entrada' ? 'input-entrada' : 'input-salida').value = localISOTime;
    }

    window.procesarJornada = async function() {
        let rawEntradaStr = document.getElementById('input-entrada').value;
        let rawSalidaStr = document.getElementById('input-salida').value;
        const esFeriado = document.getElementById('check-feriado').checked;

        let rawEntrada = new Date(rawEntradaStr);
        let rawSalida = new Date(rawSalidaStr);

        if(isNaN(rawEntrada) || isNaN(rawSalida)) { alert("Completa los horarios."); return; }

        let entrada = aplicarReglaRedondeo(rawEntrada);
        let salida = aplicarReglaRedondeo(rawSalida);

        if(salida <= entrada) { alert("La salida debe ser posterior a la entrada."); return; }

        let totalHoras = (salida - entrada) / (1000 * 60 * 60);
        let horas50 = 0, horas100 = 0, nocturnas = 0, francos = 0;

        let iter = new Date(entrada);
        while(iter < salida) {
            let h = iter.getHours();
            if(h >= 21 || h < 6) nocturnas += 0.5; 
            iter.setMinutes(iter.getMinutes() + 30);
        }

        let diaSemana = entrada.getDay(); 
        let trabajoSabadoPrevio = false;

        if (diaSemana === 0) {
            let fechaSabadoPrevio = new Date(entrada);
            fechaSabadoPrevio.setDate(fechaSabadoPrevio.getDate() - 1);
            let fechaSabadoStr = fechaSabadoPrevio.toLocaleDateString();
            trabajoSabadoPrevio = listadoTurnos.some((t) => t.fecha === fechaSabadoStr && t.id !== idEdicion);
        }

        if (esFeriado) {
            horas100 = totalHoras;
            francos = 1;
        } else if (diaSemana === 0) { 
            if (trabajoSabadoPrevio) {
                horas100 = totalHoras;
                francos = 1;
            } else {
                if (totalHoras > 6) horas50 = totalHoras - 6;
            }
        } else if (diaSemana === 6) { 
            let horasTrabajadas = 0;
            let iterSabado = new Date(entrada);
            while(iterSabado < salida) {
                if (horasTrabajadas < 6) {
                    horasTrabajadas += 0.5;
                } else {
                    if(iterSabado.getHours() >= 13) {
                        horas100 += 0.5;
                    } else {
                        horas50 += 0.5;
                    }
                }
                iterSabado.setMinutes(iterSabado.getMinutes() + 30);
            }
        } else { 
            if(totalHoras > 6) horas50 = totalHoras - 6;
        }

        const datosTurno = {
            rawEntrada: rawEntradaStr, 
            rawSalida: rawSalidaStr,   
            esFeriado: esFeriado,      
            fecha: entrada.toLocaleDateString(),
            entrada: entrada.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
            salida: salida.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
            h50: horas50,
            h100: horas100,
            hn: nocturnas,
            f: francos,
            timestamp: Date.now()
        };

        // ACCIÓN FIREBASE: Guardar o Actualizar
        try {
            if (idEdicion) {
                await updateDoc(doc(db, "turnos", idEdicion), datosTurno);
                idEdicion = null;
                document.getElementById('btn-procesar').innerText = "Calcular y Cargar Turno";
                document.getElementById('btn-procesar').style.backgroundColor = "#007bff";
            } else {
                await addDoc(turnosRef, datosTurno);
            }
            
            document.getElementById('input-entrada').value = '';
            document.getElementById('input-salida').value = '';
            document.getElementById('check-feriado').checked = false;
        } catch (e) {
            alert("Error en Firebase: " + e.message);
        }
    }

    window.editarTurno = function(id) {
        let turno = listadoTurnos.find(t => t.id === id);
        document.getElementById('input-entrada').value = turno.rawEntrada;
        document.getElementById('input-salida').value = turno.rawSalida;
        document.getElementById('check-feriado').checked = turno.esFeriado;
        idEdicion = id; 
        let btn = document.getElementById('btn-procesar');
        btn.innerText = "Actualizar Turno";
        btn.style.backgroundColor = "#28a745";
        window.scrollTo({ top: 0, behavior: 'smooth' }); 
    }

    window.eliminarTurno = async function(id) {
        if(confirm("¿Estás seguro?")) {
            await deleteDoc(doc(db, "turnos", id));
            if(idEdicion === id) {
                idEdicion = null;
                document.getElementById('btn-procesar').innerText = "Calcular y Cargar Turno";
                document.getElementById('btn-procesar').style.backgroundColor = "#007bff";
            }
        }
    }

    // --- ESCUCHA DE DATOS EN TIEMPO REAL ---
    onSnapshot(query(turnosRef, orderBy("timestamp", "desc")), (snapshot) => {
        listadoTurnos = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        actualizarTodo();
    });

    onSnapshot(francosRef, (snapshot) => {
        francosUsados = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        actualizarListas();
        actualizarTodo();
    });

    onSnapshot(vacRef, (snapshot) => {
        vacacionesTomadas = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        actualizarListas();
    });

    window.actualizarTodo = function() {
        let total50 = 0, total100 = 0, totalNoct = 0, francosGanados = 0;
        const tbody = document.querySelector("#tabla-historial tbody");
        tbody.innerHTML = ""; 

        listadoTurnos.forEach((t) => {
            total50 += t.h50;
            total100 += t.h100;
            totalNoct += t.hn;
            francosGanados += t.f;

            // Extraemos y formateamos el día de la semana sin tocar la base de datos
            let fechaObj = new Date(t.rawEntrada);
            let diaStr = fechaObj.toLocaleDateString('es-ES', { weekday: 'short' });
            let diaCapitalizado = diaStr.charAt(0).toUpperCase() + diaStr.slice(1);

            let fila = `<tr>
                <td>${diaCapitalizado} ${t.fecha}</td>
                <td>${t.entrada}</td>
                <td>${t.salida}</td>
                <td>${fmt(t.h50)}</td>
                <td>${fmt(t.h100)}</td>
                <td>${fmt(t.hn)}</td>
                <td>${t.f}</td>
                <td>
                    <button class="btn-sm btn-edit" onclick="editarTurno('${t.id}')">Editar</button>
                    <button class="btn-sm btn-delete" onclick="eliminarTurno('${t.id}')">X</button>
                </td>
            </tr>`;
            tbody.innerHTML += fila;
        });

        document.getElementById('res-50').innerText = fmt(total50);
        document.getElementById('res-100').innerText = fmt(total100);
        document.getElementById('res-night').innerText = fmt(totalNoct);
        
        let francosDisponibles = francosGanados - francosUsados.length;
        document.getElementById('res-francos').innerText = francosDisponibles;
    }

    function fmt(num) {
        let h = Math.floor(num);
        let m = Math.round((num - h) * 60);
        return `${h}:${m.toString().padStart(2, '0')}`;
    }

    // --- LÓGICA DE FRANCOS Y VACACIONES SINCRONIZADA ---
    window.registrarUsoFranco = async function() {
        let fecha = document.getElementById('fecha-uso-franco').value;
        if(!fecha) return;
        let francosDisponibles = parseInt(document.getElementById('res-francos').innerText);
        if(francosDisponibles <= 0) { alert("No tienes francos."); return; }

        let fechaObj = new Date(fecha + "T00:00:00");
        await addDoc(francosRef, { fechaStr: fechaObj.toLocaleDateString() });
        document.getElementById('fecha-uso-franco').value = ''; 
    }

    window.eliminarFranco = async function(id) {
        await deleteDoc(doc(db, "francosUsados", id));
    }

    window.registrarVacaciones = async function() {
        let desde = document.getElementById('vacaciones-desde').value;
        let hasta = document.getElementById('vacaciones-hasta').value;
        if(!desde || !hasta) return;
        
        let fechaDesde = new Date(desde + "T00:00:00");
        let fechaHasta = new Date(hasta + "T00:00:00");
        if(fechaHasta < fechaDesde) return;

        let diffTiempo = Math.abs(fechaHasta - fechaDesde);
        let diasTomados = Math.ceil(diffTiempo / (1000 * 60 * 60 * 24)) + 1;

        await addDoc(vacRef, {
            desdeStr: fechaDesde.toLocaleDateString(),
            hastaStr: fechaHasta.toLocaleDateString(),
            dias: diasTomados
        });
        document.getElementById('vacaciones-desde').value = '';
        document.getElementById('vacaciones-hasta').value = '';
    }

    window.eliminarVacaciones = async function(id) {
        await deleteDoc(doc(db, "vacaciones", id));
    }

    window.actualizarListas = function() {
        let ulFrancos = document.getElementById('lista-francos');
        ulFrancos.innerHTML = '';
        francosUsados.forEach((f) => {
            ulFrancos.innerHTML += `<li>Franco usado el: ${f.fechaStr} 
                <button class="btn-sm btn-delete" onclick="eliminarFranco('${f.id}')">Deshacer</button></li>`;
        });

        let ulVacaciones = document.getElementById('lista-vacaciones');
        ulVacaciones.innerHTML = '';
        let totalDiasUsados = 0;
        vacacionesTomadas.forEach((v) => {
            totalDiasUsados += v.dias;
            ulVacaciones.innerHTML += `<li>Del ${v.desdeStr} al ${v.hastaStr} (${v.dias} días)
                <button class="btn-sm btn-delete" onclick="eliminarVacaciones('${v.id}')">X</button></li>`;
        });
        document.getElementById('vacaciones-restantes').innerText = totalVacacionesAnuales - totalDiasUsados;
    }
</script>
</body>
</html>
