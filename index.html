<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Horas - Portones Automáticos Córdoba</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #e9ecef; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; border-bottom: 3px solid #007BFF; padding-bottom: 10px; margin-top: 0; }
        
        /* Dashboard de Resultados */
        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-bottom: 30px; }
        .box { padding: 20px; text-align: center; border-radius: 10px; color: white; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .box-50 { background: linear-gradient(135deg, #f39c12, #e67e22); }
        .box-100 { background: linear-gradient(135deg, #e74c3c, #c0392b); }
        .box-night { background: linear-gradient(135deg, #34495e, #2c3e50); }
        .box-francos { background: linear-gradient(135deg, #27ae60, #2ecc71); }
        .box label { font-size: 0.9em; opacity: 0.9; display: block; margin-bottom: 5px; }
        .box span { font-size: 1.8em; font-weight: bold; }

        /* Estilos de Formulario */
        .section { background: #f8f9fa; padding: 20px; border-radius: 10px; margin-bottom: 25px; border: 1px solid #dee2e6; }
        h3 { margin-top: 0; color: #495057; font-size: 1.2em; }
        .grid-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; color: #495057; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ced4da; border-radius: 6px; box-sizing: border-box; }
        
        /* Botones */
        .btn-group { display: flex; gap: 10px; margin-bottom: 20px; }
        .btn { flex: 1; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.3s; color: white; text-transform: uppercase; }
        .btn-in { background-color: #28a745; }
        .btn-out { background-color: #fd7e14; }
        .btn-save { background-color: #007bff; width: 100%; font-size: 1.1em; }
        .btn:hover { opacity: 0.9; transform: translateY(-1px); }

        /* Historial */
        .historial-container { margin-top: 20px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #ddd; font-size: 0.9em; }
        th { background-color: #f1f1f1; color: #333; }
        tr:hover { background-color: #f9f9f9; }

        .info-text { font-size: 0.9em; color: #6c757d; margin-top: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Control de Horas Laborales</h2>

    <div class="form-group" style="width: 200px;">
        <label>Año en curso:</label>
        <select id="select-year"></select>
    </div>

    <div class="dashboard">
        <div class="box box-50"><label>Extras 50% Totales</label><span id="res-50">0:00</span></div>
        <div class="box box-100"><label>Extras 100% Totales</label><span id="res-100">0:00</span></div>
        <div class="box box-night"><label>Nocturnas Totales</label><span id="res-night">0:00</span></div>
        <div class="box box-francos"><label>Compensatorios</label><span id="res-francos">0</span></div>
    </div>

    <div class="section">
        <h3>Registro de Jornada</h3>
        <div class="btn-group">
            <button class="btn btn-in" onclick="marcar('entrada')">Registrar Entrada</button>
            <button class="btn btn-out" onclick="marcar('salida')">Registrar Salida</button>
        </div>

        <div class="grid-inputs">
            <div>
                <label>Fecha y Hora Entrada</label>
                <input type="datetime-local" id="input-entrada">
            </div>
            <div>
                <label>Fecha y Hora Salida</label>
                <input type="datetime-local" id="input-salida">
            </div>
        </div>

        <div class="form-group" style="display: flex; align-items: center; gap: 10px;">
            <input type="checkbox" id="check-feriado" style="width: auto;">
            <label for="check-feriado" style="margin:0;">¿Es día Feriado?</label>
        </div>

        <button class="btn btn-save" onclick="procesarJornada()">Calcular y Cargar Turno</button>
    </div>

    <div class="section">
        <h3>Detalle de Turnos Cargados</h3>
        <div class="historial-container">
            <table id="tabla-historial">
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Entrada</th>
                        <th>Salida</th>
                        <th>50%</th>
                        <th>100%</th>
                        <th>Noct.</th>
                        <th>Franco</th>
                    </tr>
                </thead>
                <tbody>
                    </tbody>
            </table>
        </div>
    </div>

    <div class="section">
        <h3>Francos y Vacaciones</h3>
        <div class="grid-inputs">
            <div>
                <label>Usar Franco (Fecha)</label>
                <input type="date" id="fecha-uso-franco" onchange="descontarFranco()">
            </div>
            <div>
                <label>Vacaciones Restantes</label>
                <input type="number" id="vacaciones-restantes" value="21" readonly style="background:#eee;">
            </div>
        </div>
    </div>
</div>

<script>
    // LISTA PARA GUARDAR LOS TURNOS (MEMORIA VOLATIL HASTA FIREBASE)
    let listadoTurnos = [];

    const selectYear = document.getElementById('select-year');
    const anioActual = new Date().getFullYear();
    for(let i = anioActual-1; i <= anioActual+1; i++) {
        let opt = document.createElement('option');
        opt.value = i; opt.text = i;
        if(i === anioActual) opt.selected = true;
        selectYear.appendChild(opt);
    }

    function aplicarReglaRedondeo(fecha) {
        let f = new Date(fecha);
        let minutos = f.getMinutes();
        let horas = f.getHours();
        if (minutos >= 0 && minutos <= 5) f.setMinutes(0);
        else if (minutos > 5 && minutos <= 35) f.setMinutes(30);
        else if (minutos > 35) { f.setHours(horas + 1); f.setMinutes(0); }
        f.setSeconds(0); f.setMilliseconds(0);
        return f;
    }

    function marcar(tipo) {
        let ahora = new Date();
        let redondeada = aplicarReglaRedondeo(ahora);
        let tzoffset = (new Date()).getTimezoneOffset() * 60000;
        let localISOTime = (new Date(redondeada - tzoffset)).toISOString().slice(0, 16);
        document.getElementById(tipo === 'entrada' ? 'input-entrada' : 'input-salida').value = localISOTime;
    }

    function procesarJornada() {
        let rawEntrada = new Date(document.getElementById('input-entrada').value);
        let rawSalida = new Date(document.getElementById('input-salida').value);
        const esFeriado = document.getElementById('check-feriado').checked;

        if(isNaN(rawEntrada) || isNaN(rawSalida)) { alert("Completa los horarios."); return; }

        let entrada = aplicarReglaRedondeo(rawEntrada);
        let salida = aplicarReglaRedondeo(rawSalida);

        if(salida <= entrada) { alert("La salida debe ser posterior a la entrada."); return; }

        let totalHoras = (salida - entrada) / (1000 * 60 * 60);
        let horas50 = 0, horas100 = 0, nocturnas = 0, francos = 0;

        let iter = new Date(entrada);
        while(iter < salida) {
            let h = iter.getHours();
            if(h >= 21 || h < 6) nocturnas += 0.5; 
            iter.setMinutes(iter.getMinutes() + 30);
        }

        let diaSemana = entrada.getDay(); 
        if(diaSemana === 0 || diaSemana === 6 || esFeriado) {
            horas100 = totalHoras;
            if(diaSemana === 0 || esFeriado) francos = 1;
        } else {
            if(totalHoras > 6) horas50 = totalHoras - 6;
        }

        // AGREGAR AL LISTADO
        const nuevoTurno = {
            fecha: entrada.toLocaleDateString(),
            entrada: entrada.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
            salida: salida.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
            h50: horas50,
            h100: horas100,
            hn: nocturnas,
            f: francos
        };

        listadoTurnos.push(nuevoTurno);
        actualizarTodo();
    }

    function actualizarTodo() {
        let total50 = 0, total100 = 0, totalNoct = 0, totalFrancos = 0;
        const tbody = document.querySelector("#tabla-historial tbody");
        tbody.innerHTML = ""; // Limpiar tabla

        listadoTurnos.forEach(t => {
            total50 += t.h50;
            total100 += t.h100;
            totalNoct += t.hn;
            totalFrancos += t.f;

            // Agregar fila a la tabla
            let fila = `<tr>
                <td>${t.fecha}</td>
                <td>${t.entrada}</td>
                <td>${t.salida}</td>
                <td>${fmt(t.h50)}</td>
                <td>${fmt(t.h100)}</td>
                <td>${fmt(t.hn)}</td>
                <td>${t.f}</td>
            </tr>`;
            tbody.innerHTML += fila;
        });

        document.getElementById('res-50').innerText = fmt(total50);
        document.getElementById('res-100').innerText = fmt(total100);
        document.getElementById('res-night').innerText = fmt(totalNoct);
        document.getElementById('res-francos').innerText = totalFrancos;
    }

    function fmt(num) {
        let h = Math.floor(num);
        let m = Math.round((num - h) * 60);
        return `${h}:${m.toString().padStart(2, '0')}`;
    }

    function descontarFranco() {
        // Lógica simple para descontar de la vista actual
        let actual = parseInt(document.getElementById('res-francos').innerText);
        if(actual > 0) {
            document.getElementById('res-francos').innerText = actual - 1;
        }
    }
</script>
</body>
</html>
